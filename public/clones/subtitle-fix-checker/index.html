<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/clones/subtitle-fix-checker/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subtitle Fix Checker</title>
    <!-- 데모 시드: MP4·SRT가 로드된 상태를 가정해, 비어있을 때만 오사카 검수 예시(자막합치기 A/B 포함)를 주입.
         실제 앱 그대로 동작하며, 사용자가 직접 검수한 데이터가 있으면 그걸 우선. (Zustand persist 형식) -->
    <script>
      (function () {
        try {
          var KEY = "haru_review_items_react_v1";
          var raw = localStorage.getItem(KEY),
            has = false;
          if (raw) {
            try {
              var p = JSON.parse(raw);
              has = p && p.state && Array.isArray(p.state.items) && p.state.items.length > 0;
            } catch (e) {}
          }
          if (has) return;
          var now = "2026-05-22T10:00:00.000Z";
          var items = [
            {
              type: "자막합치기A",
              jp_text: "今日は大阪、",
              ko_text: "오늘은 오사카 ,",
              expression: "今日は大阪、|오늘은 오사카 ,",
              request: "",
              review_done: false,
              cue_missing: false,
              cue_index: 5,
              cue_start: "00:00:03,200",
              cue_end: "00:00:04,900",
              cue_start_seconds: 3.2,
              cue_end_seconds: 4.9,
              time: "00:00:04,000",
              clicked_time: "00:00:04,000",
              clicked_seconds: 4.0,
              created_at: now,
            },
            {
              type: "자막합치기B",
              jp_text: "ご紹介します",
              ko_text: "소개를 해드릴게요 라면은",
              expression: "ご紹介します|소개를 해드릴게요 라면은",
              request: "",
              review_done: false,
              cue_missing: false,
              cue_index: 6,
              cue_start: "00:00:05,000",
              cue_end: "00:00:06,800",
              cue_start_seconds: 5.0,
              cue_end_seconds: 6.8,
              time: "00:00:05,600",
              clicked_time: "00:00:05,600",
              clicked_seconds: 5.6,
              created_at: now,
            },
            {
              type: "직접수정",
              jp_text: "やっぱり大阪のたこ焼きが一番！",
              ko_text: "역시 오사카 타코야끼가 최고예요!",
              expression: "やっぱり大阪のたこ焼きが一番！|역시 오사카 타코야끼가 최고예요!",
              request: "",
              review_done: true,
              cue_missing: false,
              cue_index: 14,
              cue_start: "00:00:18,400",
              cue_end: "00:00:21,000",
              cue_start_seconds: 18.4,
              cue_end_seconds: 21.0,
              time: "00:00:19,200",
              clicked_time: "00:00:19,200",
              clicked_seconds: 19.2,
              created_at: now,
            },
          ];
          localStorage.setItem(
            KEY,
            JSON.stringify({ state: { items: items, mode: "review", pauseMode: "pause" }, version: 0 }),
          );
        } catch (e) {}
      })();
    </script>
    <!-- 데모 영상 스탠드인: MP4 자동재생이 안 되니 오사카 프레임 2컷을 배경으로 반복(재생 느낌) +
         자막 오버레이로 "검수 중인 영상" 분위기. 드롭존(css-1g7qm5f)에 CSS만 얹음(패널 재렌더 없음). -->
    <style>
      .css-1g7qm5f {
        background-image: url("/clones/subtitle-fix-checker/demo/frame1.jpg") !important;
        background-size: cover !important;
        background-position: center !important;
        position: relative !important;
        animation: sfcDemoReel 6s steps(1) infinite !important;
      }
      .css-1g7qm5f > p {
        display: none !important;
      }
      .css-1g7qm5f::after {
        content: "오늘은 오사카 ,";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 9%;
        text-align: center;
        font-size: clamp(16px, 2.4vw, 26px);
        font-weight: 800;
        letter-spacing: 0.3px;
        color: #fff;
        text-shadow: 0 2px 10px #000, 0 0 5px #000;
        pointer-events: none;
      }
      @keyframes sfcDemoReel {
        0%, 49.99% {
          background-image: url("/clones/subtitle-fix-checker/demo/frame1.jpg");
        }
        50%, 100% {
          background-image: url("/clones/subtitle-fix-checker/demo/frame2.jpg");
        }
      }
      #sfcMobileGate { display: none; }
      @media (max-width: 860px) {
        #sfcMobileGate {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          padding: 36px;
          background: #07101d;
          color: #eaf2ff;
          text-align: center;
          font-family: Pretendard, system-ui, sans-serif;
        }
      }
    </style>
    <script type="module" crossorigin src="/clones/subtitle-fix-checker/assets/index-BvooS5Rd.js"></script>
    <link rel="stylesheet" crossorigin href="/clones/subtitle-fix-checker/assets/index-YJRYby-q.css">
  </head>

    <div id="root"></div>
    <div id="sfcMobileGate" aria-label="모바일 안내">
      <div style="font-size:46px">🖥️</div>
      <strong style="font-size:18px">데스크탑에서 봐주세요</strong>
      <p style="margin:0;color:#8fa2ba;line-height:1.6;font-size:14px">이 도구는 영상·자막 검수 패널 기반이라<br>PC 화면에 최적화돼 있어요.</p>
    </div>
  </body>
</html>
